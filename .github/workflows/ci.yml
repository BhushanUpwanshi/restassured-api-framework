name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily, so a change on the live API shows up even when the code has not moved.
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  framework:
    name: api-core (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit tests, ArchUnit, coverage floor, Spotless, Checkstyle
        run: sh ./mvnw -B verify -pl api-core
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: api-core-reports
          path: |
            api-core/target/surefire-reports
            api-core/target/site/jacoco

  live:
    name: api-tests (live API)
    needs: framework
    runs-on: ubuntu-latest
    env:
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install api-core, static checks on api-tests
        run: sh ./mvnw -B install -DskipTests
      - name: Smoke
        run: sh ./mvnw -B test -pl api-tests -Dsuite=smoke
      - name: Regression
        run: sh ./mvnw -B test -pl api-tests -Dsuite=regression
      - name: Regression on the qa datasets
        run: sh ./mvnw -B test -pl api-tests -Dsuite=regression -Pqa
      - name: BDD
        if: always()
        run: sh ./mvnw -B test -pl api-tests -Dsuite=bdd
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: api-tests-reports
          path: |
            api-tests/target/allure-results
            api-tests/target/surefire-reports
            api-tests/target/cucumber-report.html
