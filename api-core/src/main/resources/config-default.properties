# Baseline configuration. Every environment inherits these and overrides what differs.
#
# Precedence, highest first:
#   1. system property      -Dapi.baseUri=...
#   2. environment variable  API_BASE_URI
#   3. config-<env>.properties
#   4. this file
#
# Credentials are NOT here. They come from API_USERNAME and API_PASSWORD; see Secrets.

api.baseUri=https://restful-booker.herokuapp.com
api.authPath=/auth

api.connectTimeoutMs=5000
api.readTimeoutMs=15000

# Transport retries, for connection resets and 5xx. Not test retries; see RetryPolicy.
api.maxRetries=2
api.retryBackoffMs=400
